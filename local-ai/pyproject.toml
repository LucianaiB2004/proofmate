[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "proofmate-local-ai"
version = "0.1.0"
description = "Optional OpenVINO local inference service for ProofMate"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.32,<1"
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.4.2", "psutil==7.2.2"]
openvino = ["openvino-genai==2026.4.0.0", "huggingface-hub==2.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore::starlette.exceptions.StarletteDeprecationWarning"
]

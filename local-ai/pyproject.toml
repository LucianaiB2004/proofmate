[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "proofmate-local-ai"
version = "0.1.0"
description = "Optional OpenVINO local inference service for ProofMate"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.32,<1"
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "psutil>=6,<8"]
openvino = ["openvino-genai>=2026.0", "huggingface-hub>=0.34"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore::starlette.exceptions.StarletteDeprecationWarning"
]
